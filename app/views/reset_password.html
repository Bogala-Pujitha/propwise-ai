<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - PropWise AI</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Reset Password</h1>
            <p>Create a new password for your PropWise AI account.</p>

            <form method="post" action="{{ url_for('password_reset_api.reset_password') }}">
                <input type="hidden" name="token" value="{{ request.args.get('token', '') }}">

                <label for="password">New password</label>
                <input id="password"
                       name="password"
                       type="password"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password"
                       name="confirm_password"
                       type="password"
                       minlength="8"
                       autocomplete="new-password"
                       required>

                <button type="submit">Reset password</button>
            </form>
        </section>
    </main>

    <script>
    document.querySelector("form").addEventListener("submit", function (event) {
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;

        if (password !== confirm) {
            event.preventDefault();
            alert("Passwords do not match.");
        }
    });
    </script>
</body>
</html>
