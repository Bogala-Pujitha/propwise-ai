<script>

    /* =========================================================
       PROPERTY TYPE COLORS
       SINGLE SOURCE OF TRUTH
    ========================================================= */

    const PROPERTY_TYPE_COLORS = {
        Apartment: '#1E3A8A',  // Blue
        House: '#475569',      // Slate
        Villa: '#B85C38',      // Brown
        Plot: '#B68B2E'        // Gold
    };


    /* =========================================================
       PROPERTY TYPE NORMALIZATION
    ========================================================= */

    function normalizePropertyType(type) {

        const value = String(type || '')
            .trim()
            .toLowerCase()
            .replace(/[\s_-]+/g, '');

        if (
            value === 'apartment' ||
            value === 'flat'
        ) {
            return 'Apartment';
        }

        if (
            value === 'house' ||
            value === 'independenthouse'
        ) {
            return 'House';
        }

        if (value === 'villa') {
            return 'Villa';
        }

        if (
            value === 'plot' ||
            value === 'land'
        ) {
            return 'Plot';
        }

        return 'Apartment';
    }


    /* =========================================================
       PROPERTY TYPE COLOR
    ========================================================= */

    function getPropertyTypeColor(type) {

        const normalizedType =
            normalizePropertyType(type);

        return (
            PROPERTY_TYPE_COLORS[normalizedType] ||
            PROPERTY_TYPE_COLORS.Apartment
        );
    }


    /* =========================================================
       GLOBAL MAP VARIABLES
    ========================================================= */

    let predictionData = null;

    let selectedPropertyMap = null;

    let comparisonPropertyMap = null;

    let propertyTypesMap = null;

    let propertyTypeMapMarkers = [];


    /* =========================================================
       SAFE NUMBER HELPER
    ========================================================= */

    function safeNumber(value, fallback = null) {

        if (
            value === null ||
            value === undefined ||
            value === ''
        ) {
            return fallback;
        }

        const number =
            Number(value);

        return Number.isFinite(number)
            ? number
            : fallback;
    }


    /* =========================================================
       MAP MARKER CREATOR
    ========================================================= */

    function createPropertyMarker(
        color,
        label,
        price
    ) {

        let priceHtml = '';

        if (
            price !== null &&
            price !== undefined &&
            Number.isFinite(
                Number(price)
            )
        ) {

            priceHtml =
                '<br>₹' +
                formatNumber(
                    Number(price)
                );
        }

        return L.divIcon({

            className:
                'property-map-marker',

            html:
                '<div style="' +
                'background:' + color + ';' +
                'color:white;' +
                'padding:5px 9px;' +
                'border-radius:14px;' +
                'font-size:10px;' +
                'font-weight:700;' +
                'line-height:1.25;' +
                'white-space:nowrap;' +
                'box-shadow:0 2px 6px rgba(0,0,0,.18);' +
                '">' +
                (label || '') +
                priceHtml +
                '</div>',

            iconSize: [
                125,
                40
            ],

            iconAnchor: [
                62,
                20
            ]
        });
    }


    /* =========================================================
       SELECTED PROPERTY MARKER
       Uses the SAME property color system
    ========================================================= */

    function createSelectedMarker(
        propertyType,
        price
    ) {

        const color =
            getPropertyTypeColor(
                propertyType
            );

        let priceHtml = '';

        if (
            price !== null &&
            price !== undefined &&
            Number.isFinite(
                Number(price)
            )
        ) {

            priceHtml =
                '<br>₹' +
                formatNumber(
                    Number(price)
                );
        }

        return L.divIcon({

            className:
                'selected-property-marker',

            html:
                '<div style="' +
                'background:' + color + ';' +
                'border:2px solid #111827;' +
                'color:#ffffff;' +
                'padding:6px 10px;' +
                'border-radius:16px;' +
                'font-size:10px;' +
                'font-weight:700;' +
                'line-height:1.25;' +
                'white-space:nowrap;' +
                'box-shadow:0 2px 8px rgba(0,0,0,.28);' +
                '">' +
                'SELECTED ' +
                normalizePropertyType(
                    propertyType
                ) +
                priceHtml +
                '</div>',

            iconSize: [
                145,
                44
            ],

            iconAnchor: [
                72,
                22
            ]
        });
    }


    /* =========================================================
       GET SELECTED PROPERTY COORDINATES
    ========================================================= */

    function getSelectedPropertyCoordinates() {

        if (!predictionData) {
            return null;
        }

        const location =
            predictionData.location_features || {};

        const latitude =
            safeNumber(
                location.latitude
            );

        const longitude =
            safeNumber(
                location.longitude
            );

        if (
            latitude === null ||
            longitude === null
        ) {
            return null;
        }

        return {
            latitude: latitude,
            longitude: longitude
        };
    }


    /* =========================================================
       MAP 1
       EXACT / RETURNED LOCATION OF SELECTED PROPERTY
    ========================================================= */

    function renderSelectedPropertyMap() {

        const container =
            document.getElementById(
                'selectedPropertyMap'
            );

        if (
            !container ||
            !predictionData
        ) {
            return;
        }


        /* Remove previous map */

        if (selectedPropertyMap) {

            selectedPropertyMap.remove();

            selectedPropertyMap = null;
        }


        /* Get coordinates */

        const coordinates =
            getSelectedPropertyCoordinates();


        if (!coordinates) {

            container.innerHTML =
                '<div style="' +
                'padding:20px;' +
                'color:#64748b;' +
                'font-size:13px;' +
                '">' +
                'Location coordinates are not available for this property.' +
                '</div>';

            return;
        }


        const latitude =
            coordinates.latitude;

        const longitude =
            coordinates.longitude;


        /* Create map */

        selectedPropertyMap =
            L.map(
                'selectedPropertyMap'
            ).setView(
                [
                    latitude,
                    longitude
                ],
                15
            );


        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:
                    '&copy; OpenStreetMap contributors',

                maxZoom: 19
            }
        ).addTo(
            selectedPropertyMap
        );


        const propertyType =
            normalizePropertyType(
                predictionData.property_type
            );


        /* Selected property marker */

        const marker =
            L.marker(
                [
                    latitude,
                    longitude
                ],
                {
                    icon:
                        createSelectedMarker(
                            propertyType,
                            predictionData.predicted_price
                        )
                }
            ).addTo(
                selectedPropertyMap
            );


        marker.bindPopup(
            '<b>Selected Property</b><br>' +

            'Type: ' +
            propertyType +
            '<br>' +

            'City: ' +
            (
                predictionData.city ||
                'N/A'
            ) +
            '<br>' +

            'Locality: ' +
            (
                predictionData.locality ||
                'N/A'
            ) +
            '<br>' +

            'Coordinates: ' +
            latitude.toFixed(6) +
            ', ' +
            longitude.toFixed(6)
        );


        /* Update information below the map */

        const propertyLabel =
            document.getElementById(
                'selectedMapPropertyLabel'
            );

        if (propertyLabel) {

            propertyLabel.textContent =
                propertyType +
                ' — ' +
                (
                    predictionData.locality ||
                    predictionData.city ||
                    'Selected property'
                );
        }


        const coordinateLabel =
            document.getElementById(
                'selectedMapCoordinates'
            );

        if (coordinateLabel) {

            coordinateLabel.textContent =
                latitude.toFixed(6) +
                ', ' +
                longitude.toFixed(6);
        }


        setTimeout(
            function () {

                if (
                    selectedPropertyMap
                ) {

                    selectedPropertyMap
                        .invalidateSize();
                }

            },
            150
        );
    }


    /* =========================================================
       BUILD COMPARABLE PAYLOAD
    ========================================================= */

    function buildComparablePayload() {

        if (!predictionData) {
            return null;
        }


        const areaElement =
            document.getElementById(
                'area'
            );

        const bedroomsElement =
            document.getElementById(
                'bedrooms'
            );

        const bathroomsElement =
            document.getElementById(
                'bathrooms'
            );

        const ageElement =
            document.getElementById(
                'age'
            );


        const areaValue =
            safeNumber(
                predictionData.area_sqft,
                safeNumber(
                    areaElement
                        ? areaElement.value
                        : null,
                    0
                )
            );


        const bhkValue =
            safeNumber(
                predictionData.bhk,
                safeNumber(
                    bedroomsElement
                        ? bedroomsElement.value
                        : null,
                    2
                )
            );


        const bathroomValue =
            safeNumber(
                predictionData.bathrooms,
                safeNumber(
                    bathroomsElement
                        ? bathroomsElement.value
                        : null,
                    2
                )
            );


        const ageValue =
            safeNumber(
                predictionData.property_age,
                safeNumber(
                    ageElement
                        ? ageElement.value
                        : null,
                    5
                )
            );


        return {

            property_type:
                predictionData.property_type ||
                'Apartment',

            city:
                predictionData.city ||
                'Hyderabad',

            locality:
                predictionData.locality ||
                '',

            area_sqft:
                areaValue,

            bhk:
                bhkValue,

            bathrooms:
                bathroomValue,

            property_age:
                ageValue
        };
    }


    /* =========================================================
       MAP 2
       SELECTED PROPERTY + COMPARABLE PROPERTIES
    ========================================================= */

    async function renderComparisonPropertyMap() {

        const container =
            document.getElementById(
                'comparisonPropertyMap'
            );

        if (
            !container ||
            !predictionData
        ) {
            return;
        }


        if (comparisonPropertyMap) {

            comparisonPropertyMap.remove();

            comparisonPropertyMap = null;
        }


        const coordinates =
            getSelectedPropertyCoordinates();


        if (!coordinates) {

            container.innerHTML =
                '<div style="' +
                'padding:20px;' +
                'color:#64748b;' +
                'font-size:13px;' +
                '">' +
                'Selected property coordinates are unavailable.' +
                '</div>';

            return;
        }


        const selectedLatitude =
            coordinates.latitude;

        const selectedLongitude =
            coordinates.longitude;


        comparisonPropertyMap =
            L.map(
                'comparisonPropertyMap'
            ).setView(
                [
                    selectedLatitude,
                    selectedLongitude
                ],
                14
            );


        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:
                    '&copy; OpenStreetMap contributors',

                maxZoom: 19
            }
        ).addTo(
            comparisonPropertyMap
        );


        const bounds = [];


        /* ---------------------------------------------------------
           SELECTED PROPERTY
        --------------------------------------------------------- */

        const selectedType =
            normalizePropertyType(
                predictionData.property_type
            );


        const selectedMarker =
            L.marker(
                [
                    selectedLatitude,
                    selectedLongitude
                ],
                {
                    icon:
                        createSelectedMarker(
                            selectedType,
                            predictionData.predicted_price
                        )
                }
            ).addTo(
                comparisonPropertyMap
            );


        selectedMarker.bindPopup(
            '<b>Selected Property</b><br>' +

            'Type: ' +
            selectedType +
            '<br>' +

            'City: ' +
            (
                predictionData.city ||
                'N/A'
            ) +
            '<br>' +

            'Locality: ' +
            (
                predictionData.locality ||
                'N/A'
            )
        );


        bounds.push(
            [
                selectedLatitude,
                selectedLongitude
            ]
        );


        /* ---------------------------------------------------------
           FIRST SOURCE:
           COMPARABLES ALREADY RETURNED BY PREDICTION
        --------------------------------------------------------- */

        let comparableData = [];


        if (
            Array.isArray(
                predictionData.comparables
            )
        ) {

            comparableData =
                predictionData.comparables;
        }


        /* ---------------------------------------------------------
           FALLBACK:
           REQUEST COMPARABLE MAP DATA
        --------------------------------------------------------- */

        if (
            comparableData.length === 0
        ) {

            try {

                const payload =
                    buildComparablePayload();


                const response =
                    await fetch(
                        '/api/map/comparables',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(
                                    payload
                                )
                        }
                    );


                if (response.ok) {

                    const data =
                        await response.json();

                    comparableData =
                        Array.isArray(
                            data.properties
                        )
                            ? data.properties
                            : [];
                }

            } catch (error) {

                console.warn(
                    'Comparable map endpoint unavailable:',
                    error
                );
            }
        }


        /* ---------------------------------------------------------
           COMPARABLE MARKERS
        --------------------------------------------------------- */

        comparableData.forEach(
            function (
                property,
                index
            ) {

                if (
                    !property ||
                    typeof property !==
                    'object'
                ) {
                    return;
                }


                const latitude =
                    safeNumber(
                        property.latitude
                    );

                const longitude =
                    safeNumber(
                        property.longitude
                    );


                /*
                    A comparable without coordinates
                    cannot be drawn on a map.
                */

                if (
                    latitude === null ||
                    longitude === null
                ) {
                    return;
                }


                const propertyType =
                    normalizePropertyType(
                        property.property_type
                    );


                const marker =
                    L.marker(
                        [
                            latitude,
                            longitude
                        ],
                        {
                            icon:
                                createPropertyMarker(
                                    getPropertyTypeColor(
                                        propertyType
                                    ),
                                    propertyType,
                                    property.price
                                )
                        }
                    ).addTo(
                        comparisonPropertyMap
                    );


                marker.bindPopup(
                    '<b>Comparable #' +
                    (
                        index + 1
                    ) +
                    '</b><br>' +

                    'Type: ' +
                    propertyType +
                    '<br>' +

                    'City: ' +
                    (
                        property.city ||
                        predictionData.city ||
                        'N/A'
                    ) +
                    '<br>' +

                    'Locality: ' +
                    (
                        property.locality ||
                        'N/A'
                    ) +
                    '<br>' +

                    'Area: ' +
                    (
                        property.area_sqft
                            ? Number(
                                property.area_sqft
                            ).toLocaleString(
                                'en-IN'
                            ) +
                            ' sqft'
                            : 'N/A'
                    ) +
                    '<br>' +

                    'BHK: ' +
                    (
                        property.bhk ||
                        property.bedrooms ||
                        'N/A'
                    ) +
                    '<br>' +

                    'Price: ' +
                    (
                        property.price !== null &&
                            property.price !== undefined
                            ? '₹' +
                            formatNumber(
                                property.price
                            )
                            : 'N/A'
                    )
                );


                bounds.push(
                    [
                        latitude,
                        longitude
                    ]
                );
            }
        );


        /* ---------------------------------------------------------
           MAP VIEW
        --------------------------------------------------------- */

        if (
            bounds.length > 1
        ) {

            comparisonPropertyMap.fitBounds(
                bounds,
                {
                    padding: [
                        30,
                        30
                    ]
                }
            );

        } else {

            comparisonPropertyMap.setView(
                [
                    selectedLatitude,
                    selectedLongitude
                ],
                15
            );
        }


        setTimeout(
            function () {

                if (
                    comparisonPropertyMap
                ) {

                    comparisonPropertyMap
                        .invalidateSize();
                }

            },
            150
        );
    }


    /* =========================================================
       MAP 3
       PROPERTY TYPES IN SELECTED CITY / LOCALITY
    ========================================================= */

    async function renderPropertyTypesMap() {

        const container =
            document.getElementById(
                'propertyTypesMap'
            );

        if (
            !container ||
            !predictionData
        ) {
            return;
        }


        if (propertyTypesMap) {

            propertyTypesMap.remove();

            propertyTypesMap = null;
        }


        propertyTypeMapMarkers = [];


        propertyTypesMap =
            L.map(
                'propertyTypesMap'
            );


        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution:
                    '&copy; OpenStreetMap contributors',

                maxZoom: 19
            }
        ).addTo(
            propertyTypesMap
        );


        const city =
            String(
                predictionData.city ||
                ''
            ).trim();


        const locality =
            String(
                predictionData.locality ||
                ''
            ).trim();


        /*
            No property_type parameter here.
    
            This intentionally asks the backend for:
            Apartment + House + Villa + Plot
        */

        const params =
            new URLSearchParams();


        if (city) {

            params.set(
                'city',
                city
            );
        }


        if (locality) {

            params.set(
                'locality',
                locality
            );
        }


        let properties = [];


        try {

            const response =
                await fetch(
                    '/api/map/properties?' +
                    params.toString()
                );


            if (response.ok) {

                const data =
                    await response.json();

                properties =
                    Array.isArray(
                        data.properties
                    )
                        ? data.properties
                        : [];
            }

        } catch (error) {

            console.warn(
                'Property type map request failed:',
                error
            );
        }


        const bounds = [];


        /* ---------------------------------------------------------
           PROPERTY TYPE MARKERS
        --------------------------------------------------------- */

        properties.forEach(
            function (property) {

                if (
                    !property ||
                    typeof property !==
                    'object'
                ) {
                    return;
                }


                const latitude =
                    safeNumber(
                        property.latitude
                    );

                const longitude =
                    safeNumber(
                        property.longitude
                    );


                if (
                    latitude === null ||
                    longitude === null
                ) {
                    return;
                }


                const propertyType =
                    normalizePropertyType(
                        property.property_type
                    );


                const marker =
                    L.marker(
                        [
                            latitude,
                            longitude
                        ],
                        {
                            icon:
                                createPropertyMarker(
                                    getPropertyTypeColor(
                                        propertyType
                                    ),
                                    propertyType,
                                    property.price
                                )
                        }
                    ).addTo(
                        propertyTypesMap
                    );


                marker.city =
                    property.city ||
                    city;


                marker.locality =
                    property.locality ||
                    locality;


                marker.propertyType =
                    propertyType;


                marker.bindPopup(
                    '<b>' +
                    propertyType +
                    '</b><br>' +

                    'City: ' +
                    (
                        property.city ||
                        city ||
                        'N/A'
                    ) +
                    '<br>' +

                    'Locality: ' +
                    (
                        property.locality ||
                        locality ||
                        'N/A'
                    ) +
                    '<br>' +

                    'Area: ' +
                    (
                        property.area_sqft
                            ? Number(
                                property.area_sqft
                            ).toLocaleString(
                                'en-IN'
                            ) +
                            ' sqft'
                            : 'N/A'
                    ) +
                    '<br>' +

                    'BHK: ' +
                    (
                        property.bhk ||
                        property.bedrooms ||
                        'N/A'
                    ) +
                    '<br>' +

                    'Price: ' +
                    (
                        property.price !== null &&
                            property.price !== undefined
                            ? '₹' +
                            formatNumber(
                                property.price
                            )
                            : 'N/A'
                    )
                );


                propertyTypeMapMarkers.push(
                    marker
                );


                bounds.push(
                    [
                        latitude,
                        longitude
                    ]
                );
            }
        );


        /* ---------------------------------------------------------
           MAP VIEW
        --------------------------------------------------------- */

        if (
            bounds.length > 0
        ) {

            propertyTypesMap.fitBounds(
                bounds,
                {
                    padding: [
                        30,
                        30
                    ]
                }
            );

        } else {

            const coordinates =
                getSelectedPropertyCoordinates();


            if (coordinates) {

                propertyTypesMap.setView(
                    [
                        coordinates.latitude,
                        coordinates.longitude
                    ],
                    13
                );

            } else {

                /*
                    Hyderabad is used only as a last-resort
                    fallback when there is no location data.
                */

                propertyTypesMap.setView(
                    [
                        17.3850,
                        78.4867
                    ],
                    11
                );
            }
        }


        updatePropertyTypeMapSummary();


        setTimeout(
            function () {

                if (
                    propertyTypesMap
                ) {

                    propertyTypesMap
                        .invalidateSize();
                }

            },
            150
        );
    }


    /* =========================================================
       MAP 3 FILTER
    ========================================================= */

    function filterPropertyTypeMap() {

        if (!propertyTypesMap) {
            return;
        }


        const filter =
            document.getElementById(
                'propertyTypeMapFilter'
            );


        const selectedType =
            filter
                ? filter.value
                : 'all';


        propertyTypeMapMarkers.forEach(
            function (marker) {

                const markerType =
                    normalizePropertyType(
                        marker.propertyType
                    );


                const shouldShow =
                    selectedType === 'all' ||
                    markerType ===
                    normalizePropertyType(
                        selectedType
                    );


                if (shouldShow) {

                    marker.addTo(
                        propertyTypesMap
                    );

                } else {

                    propertyTypesMap.removeLayer(
                        marker
                    );
                }
            }
        );


        updatePropertyTypeMapSummary();
    }


    /* =========================================================
       MAP 3 SUMMARY
    ========================================================= */

    function updatePropertyTypeMapSummary() {

        const summary =
            document.getElementById(
                'propertyTypeMapSummary'
            );


        if (!summary) {
            return;
        }


        const counts = {
            Apartment: 0,
            House: 0,
            Villa: 0,
            Plot: 0
        };


        propertyTypeMapMarkers.forEach(
            function (marker) {

                const type =
                    normalizePropertyType(
                        marker.propertyType
                    );


                if (
                    Object.prototype
                        .hasOwnProperty
                        .call(
                            counts,
                            type
                        )
                ) {

                    counts[type] += 1;
                }
            }
        );


        summary.innerHTML =
            Object.keys(
                counts
            ).map(
                function (type) {

                    return (
                        '<div class="map-summary-item">' +

                        '<span style="' +
                        'display:inline-block;' +
                        'width:8px;' +
                        'height:8px;' +
                        'border-radius:50%;' +
                        'background:' +
                        getPropertyTypeColor(
                            type
                        ) +
                        ';' +
                        'margin-right:5px;' +
                        '"></span>' +

                        '<strong>' +
                        type +
                        ':</strong> ' +

                        counts[type] +

                        '</div>'
                    );
                }
            ).join('');
    }


    /* =========================================================
       MASTER MAP RENDERER
    ========================================================= */

    function renderMap() {

        /*
            MAP 1:
            Selected property
        */

        renderSelectedPropertyMap();


        /*
            MAP 2:
            Selected property + comparables
    
            This function is async internally.
        */

        renderComparisonPropertyMap();


        /*
            MAP 3:
            All property types in selected locality
        */

        renderPropertyTypesMap();
    }

</script>
