<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PropWise AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/clean.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="nav-logo" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;color:var(--primary);font-size:1.3rem;font-weight:700;">
                <i class="fas fa-home"></i> PropWise AI
            </a>
            <h2>Create Account</h2>
            <p class="subtitle">Join PropWise AI for free</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="/register">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password" required minlength="6">
                </div>
                <button type="submit" class="btn-primary btn-full">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            <div class="auth-links">
                Already have an account? <a href="/login">Login</a>
            </div>
        </div>
    </div>
</body>
</html>
