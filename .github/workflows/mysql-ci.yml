name: PropWise MySQL CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: propwise_ci
          MYSQL_USER: propwise
          MYSQL_PASSWORD: propwise
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql+pymysql://propwise:propwise@127.0.0.1:3306/propwise_ci?charset=utf8mb4
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://propwise:propwise@127.0.0.1:3306/propwise_ci?charset=utf8mb4
      SECRET_KEY: ci-test-secret-key
      FLASK_ENV: testing
      TESTING: "true"
      PROPWISE_TESTING: "0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import time
          import pymysql
          for _ in range(30):
              try:
                  pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="propwise",
                      password="propwise",
                      database="propwise_ci",
                  ).close()
                  print("MySQL ready")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MySQL did not become ready")
          PY

      - name: Run MySQL integration test
        run: python -m pytest -q tests/database/test_mysql_integration.py
