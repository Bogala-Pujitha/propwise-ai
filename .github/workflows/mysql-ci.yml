name: PropWise MySQL CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: propwise_ci
          MYSQL_USER: propwise
          MYSQL_PASSWORD: propwise
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql+pymysql://propwise:propwise@127.0.0.1:3306/propwise_ci?charset=utf8mb4
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://propwise:propwise@127.0.0.1:3306/propwise_ci?charset=utf8mb4
      SECRET_KEY: ci-test-secret-key
      FLASK_ENV: testing
      TESTING: "true"
      PROPWISE_TESTING: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify MySQL connection
        run: |
          python - <<'PY'
          import pymysql
          import time

          for attempt in range(30):
              try:
                  connection = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="propwise",
                      password="propwise",
                      database="propwise_ci",
                      charset="utf8mb4",
                      connect_timeout=5,
                  )

                  with connection.cursor() as cursor:
                      cursor.execute("SELECT 1")
                      result = cursor.fetchone()

                  connection.close()

                  print(f"MySQL ready: SELECT 1 -> {result}")
                  break

              except Exception as exc:
                  print(
                      f"MySQL connection attempt "
                      f"{attempt + 1}/30 failed: {exc}"
                  )
                  time.sleep(2)
          else:
              raise SystemExit("MySQL did not become ready")

          PY

      - name: Initialize application schema
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()

          with app.app_context():
              from app.extensions import db
              db.create_all()

          print("MySQL application schema initialized")
          PY

      - name: Run MySQL integration tests
        run: |
          python -m pytest -q tests/database/test_mysql_integration.py