name: PropWise CI Hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SECRET_KEY: ci-test-secret-key
  FLASK_ENV: testing
  TESTING: "true"

jobs:
  quality-and-tests:
    name: Python quality + tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest flake8

      - name: Compile
        run: python -m compileall -q app ml tests

      - name: Lint
        run: flake8 app ml tests --count --statistics

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Import smoke test
        run: python -c "from app import app; print('PropWise app import OK')"

  security-smoke:
    name: Security smoke tests
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run security tests
        run: |
          python -m pytest -q tests/security
