name: PropWise AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          . .venv/bin/activate
          flake8 app/ ml/ tests/ --max-line-length=120 --ignore=E501,W503,E402

      - name: Run test suite
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -v --tb=short

      - name: Import/build verification
        run: |
          . .venv/bin/activate
          python -c "from app import app; print('Flask app import successful')"

  release-check:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Release verification
        run: |
          . .venv/bin/activate
          python -c "from app import app; assert app is not None; print('Release verification passed')"
