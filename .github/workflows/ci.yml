name: PropWise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-secret-key-for-ci
      FLASK_ENV: testing
      TESTING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall -q app ml tests

      - name: Run tests
        run: |
          pytest -q

  smoke-import:
    runs-on: ubuntu-latest
    needs: test

    env:
      SECRET_KEY: test-secret-key-for-ci
      FLASK_ENV: testing
      TESTING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import application
        run: |
          python -c "from app import app; print('PropWise app import OK')"