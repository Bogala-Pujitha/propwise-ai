name: PropWise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  SECRET_KEY: "ci-test-secret-key"
  FLASK_ENV: "testing"
  TESTING: "true"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify project structure
        run: |
          test -f requirements.txt
          test -d app
          test -d ml
          test -d tests

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest flake8

      - name: Compile Python
        run: |
          python -m compileall -q app ml tests

      - name: Run Flake8
        continue-on-error: true
        run: |
          flake8 app ml tests --count --statistics

      - name: Run tests
        run: |
          python -m pytest -q

  smoke-import:
    name: Application Smoke Test
    runs-on: ubuntu-latest
    needs: test

    env:
      SECRET_KEY: "ci-test-secret-key"
      FLASK_ENV: "testing"
      TESTING: "true"
      PROPWISE_TESTING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify requirements
        run: |
          test -f requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import application
        run: |
          python -c "from app import app; print('PropWise app import OK')"