name: PropWise AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app/ ml/ tests/ --max-line-length=120 --ignore=E501,W503,E402 || true

    - name: Generate processed datasets
      run: |
        python ml/preprocessing/data_pipeline.py

    - name: Verify processed datasets
      run: |
        ls -la data/processed/
        test -f data/processed/master_dataset.csv || (echo "ERROR: master_dataset.csv not found" && exit 1)
        test -f data/processed/hyderabad_test_set.csv || (echo "ERROR: hyderabad_test_set.csv not found" && exit 1)
        test -f data/processed/hyderabad_train_set.csv || (echo "ERROR: hyderabad_train_set.csv not found" && exit 1)

    - name: Run data pipeline tests
      run: |
        python -m pytest tests/test_all.py::TestDataPipeline -v

    - name: Run ML model tests
      run: |
        python -m pytest tests/test_all.py::TestMLModels -v

    - name: Run valuation engine tests
      run: |
        python -m pytest tests/test_all.py::TestValuationEngine -v

    - name: Run backend route tests
      run: |
        python -m pytest tests/test_all.py::TestBackendRoutes -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate processed datasets
      run: |
        python ml/preprocessing/data_pipeline.py

    - name: Verify processed datasets
      run: |
        test -f data/processed/master_dataset.csv || (echo "ERROR: master_dataset.csv not found" && exit 1)

    - name: Run full test suite
      run: |
        python -m pytest tests/test_all.py -v --tb=short

    - name: Build verification
      run: |
        python -c "from app import app; print('Build successful: Flask app imports correctly')"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy placeholder
      run: |
        echo "Deployment configuration ready"
        echo "Add your deployment steps here (Docker, AWS, GCP, etc.)"
